<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="GoAthlete — Book venues, join tournaments, and track your athletic performance on mobile and tablet.">
  <meta name="theme-color" content="#0A1F35">

  <!-- Google Sign-In Web Client ID -->
  <meta name="google-signin-client_id" content="740629489616-c6j07tvj7gg7a6ulfpsu8tmptf151adu.apps.googleusercontent.com">

  <!-- iOS Safari PWA & Home Screen meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GoAthlete">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon & PWA Manifest -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>GoAthlete</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #030929;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    #goathlete-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #030929 0%, #0A1F35 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 9999;
      transition: opacity 0.25s ease-out;
    }

    #goathlete-loader img {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      margin-bottom: 18px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    .loader-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #DA6F2B;
      border-radius: 50%;
      animation: goathlete-spin 0.8s linear infinite;
    }

    @keyframes goathlete-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="goathlete-loader" aria-label="Loading GoAthlete">
    <img src="icons/Icon-192.png" alt="GoAthlete">
    <div class="loader-spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('goathlete-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () { loader.remove(); }, 260);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
