server {
    listen 80;
    server_name app.goathelet.org.in;

    root /var/www/goathlete/customer_web;
    index index.html;

    # Compression for Flutter Web JS, WASM, JSON, and fonts
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/wasm
        image/svg+xml;

    # Security & PWA permissions (allow GPS + camera for QR scanning on same origin)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self)" always;

    # Always revalidate entrypoints & PWA metadata so users get updates immediately
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Cache static hashed assets & icons aggressively
    location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing fallback for go_router paths (/explore, /bookings, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
